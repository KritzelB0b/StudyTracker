<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="./manifest.webmanifest"><title>StudyTracker 2.5</title><style>
:root{font:15px system-ui,-apple-system,sans-serif;color:#e5eaf5;background:#0b1020}*{box-sizing:border-box}body{margin:0}.shell{max-width:1250px;margin:auto;padding:24px 18px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}h1{font-size:clamp(25px,4vw,36px);margin:0}.sub{color:#9aacc8;font-size:13px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:12px;margin-bottom:8px}.nav button{flex:none}.btn,button{border:1px solid #384863;background:#202e48;color:#dce8fa;border-radius:11px;padding:10px 13px;cursor:pointer;font:inherit}.active,.primary{background:#78a8f2;color:#09172e;font-weight:750}.card{border-radius:16px;border:1px solid #2b3b56;background:#151f34;padding:20px;margin:13px 0;overflow:hidden}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{font-weight:800;font-size:29px;margin:8px 0}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.scroll{max-height:420px;overflow:auto;overscroll-behavior:contain}.entry{padding:10px 0;border-bottom:1px solid #31415a}.tag{font-size:11px;border-radius:7px;background:#304564;padding:3px 8px}input{background:#0c172a;color:#fff;border:1px solid #425575;border-radius:9px;padding:12px;width:100%;font:inherit}label{display:block;margin:10px 0 5px}.check{width:auto;margin-right:8px}a{color:#9cc7ff}.week{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));gap:9px;overflow:auto}.day{padding:10px;background:#101b2e;border:1px solid #2b3b56;border-radius:12px;min-height:160px}.calendaritem{border-left:4px solid #60a5fa;background:#1c2c46;padding:6px;margin:6px 0;font-size:12px;border-radius:5px}.calendaritem.task{border-color:#fb923c}.calendaritem.exam{border-color:#f87171}.calendaritem.learn{border-color:#34d399}.calendaritem.exercise{border-color:#fbbf24}.calendaritem.tutor{border-color:#a78bfa}.calendaritem.practice{border-color:#2dd4bf}.stack{display:grid;gap:8px}iframe{width:100%;height:80vh;border:0;border-radius:16px}#status{margin:15px 0;color:#a7b7cf}#mode{border:1px solid #3b4e6c;border-radius:30px;padding:5px 10px;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.card{padding:14px}.week{display:flex;scroll-snap-type:x mandatory}.day{min-width:77vw;scroll-snap-align:start}header{align-items:start}.shell{padding:14px 12px 60px}.nav{position:sticky;top:0;background:#0b1020;z-index:5}} </style></head><body><div class="shell"><header><div><div class="sub">STUDYTRACKER · STUDIUM</div><h1>Mein Studiencockpit</h1></div><span id="mode">Öffentlicher Lesemodus</span></header><nav class="nav" id="nav"></nav><div id="status" role="status">Öffentliche Daten werden geladen …</div><main id="main"></main></div><script>
'use strict';const API='https://studytracker-api-production-7134.up.railway.app';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=null,tab='dashboard',authenticated=false;const sections=[['dashboard','Dashboard & Lernstatistiken'],['modules','Module & Themen'],['calendar','Stundenplan & Kalender'],['tasks','Aufgaben & Abgaben'],['exams','Prüfungen'],['cockpit','Lerncockpit'],['settings','Daten & Einstellungen']];let weekOffset=0;
const token=()=>sessionStorage.getItem('studytracker_cloud_token');
function allowed(t){return t==='settings'||(authenticated&&t==='editor')||!!data?.fields?.includes(t)}
function nav(){const nav=$('nav');nav.replaceChildren();for(const [id,name] of sections){if(!allowed(id))continue;const b=document.createElement('button');b.textContent=name;b.className=tab===id?'active':'';b.onclick=()=>{tab=id;render()};nav.append(b)}if(authenticated){const b=document.createElement('button');b.textContent='Bearbeiten';b.className=tab==='editor'?'active':'';b.onclick=()=>{tab='editor';render()};nav.append(b)}}
function hours(n){return Number(n||0).toLocaleString('de-DE',{maximumFractionDigits:1})+' h'}
function render(){if(!allowed(tab))tab='settings';nav();$('mode').textContent=authenticated?'Angemeldet · Bearbeitung möglich':'Öffentlicher Lesemodus';const el=$('main');if(tab==='settings'){el.innerHTML=`<section class="card"><h2>Daten & Einstellungen</h2><p class="sub">Anmeldung ausschließlich hier. Ohne Anmeldung sind alle angezeigten Daten schreibgeschützt.</p><div id="authArea">${authenticated?'<p>Angemeldet. Zum Bearbeiten den Reiter „Bearbeiten“ öffnen.</p><button id="logout">Abmelden</button>':'<label>E-Mail-Adresse<input id="email" type="email" autocomplete="username"></label><label>Passwort<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="login">Anmelden</button>'}</div><div id="preferences" class="${authenticated?'':'hidden'}"><h3>Öffentliche Freigaben</h3><p class="sub">Private Notizen, Praxisphasen, Moodle-Links und Dateien können nicht öffentlich freigegeben werden.</p><label><input class="check" id="publish" type="checkbox">Öffentliches Dashboard aktivieren</label>${sections.filter(x=>x[0]!=='settings').map(x=>`<label><input class="check" type="checkbox" value="${x[0]}" name="visibility">${esc(x[1])}</label>`).join('')}<button id="savePrefs">Freigaben speichern</button><p id="prefMsg" class="sub"></p></div></section>`;wireAuth();return}
if(tab==='editor'){el.innerHTML='<div class="card"><h2>Privater Bearbeitungsbereich</h2><p class="sub">Die bestehenden Werkzeuge und Daten bleiben vollständig erhalten.</p><iframe title="Privater StudyTracker-Editor" src="./editor.html"></iframe></div>';return}
if(!data){el.innerHTML='<div class="card">Keine öffentlichen Daten freigegeben.</div>';return}
if(tab==='dashboard'||tab==='cockpit'){const s=data.summary||{};el.innerHTML=`<div class="grid"><div class="card"><div class="sub">Gesamte Lernzeit</div><div class="metric">${hours(s.hours)}</div></div><div class="card"><div class="sub">Lerneinheiten</div><div class="metric">${s.sessions||0}</div></div><div class="card"><div class="sub">Module</div><div class="metric">${(data.by_module||[]).length}</div></div></div><div class="card"><h2>Lernzeit je Modul</h2><div class="scroll">${(data.by_module||[]).map(x=>`<div class="entry row"><span>${esc(x.name)}</span><b>${hours(x.hours)}</b></div>`).join('')||'Keine Lerneinheiten vorhanden'}</div></div>`;return}
if(tab==='modules'){el.innerHTML=`<div class="card"><h2>Module und Themen</h2><div class="scroll">${(data.modules||[]).map(m=>`<details class="entry"><summary><b>${esc(m.name)}</b> · ${m.ects??'–'} ECTS</summary><div style="padding:8px 18px">${(data.topics||[]).filter(t=>t.moduleId===m.id).map(t=>`<div class="entry">${t.parentId?'↳ ':''}${esc(t.name)} <span class="tag">Wissensstand ${t.mastery}/5</span></div>`).join('')||'Keine Themen freigegeben'}</div></details>`).join('')}</div></div>`;return}
if(tab==='calendar'){const today=new Date(),monday=new Date(today);monday.setDate(today.getDate()-(today.getDay()+6)%7+weekOffset*7);const dates=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d.toISOString().slice(0,10)});el.innerHTML=`<div class="card"><div class="row"><h2>Wochenkalender</h2><div><button id="prev">←</button> <button id="next">→</button></div></div><div class="week">${dates.map(d=>`<div class="day"><b>${new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}</b>${(data.events||[]).filter(x=>x.date===d).map(x=>`<div class="calendaritem ${/übung/i.test(x.kind+' '+x.title)?'exercise':/tutor/i.test(x.kind+' '+x.title)?'tutor':''}">${esc(x.start)} ${esc(x.title)}</div>`).join('')}${(data.tasks||[]).filter(x=>x.date===d).map(x=>`<div class="calendaritem task">Aufgabe: ${esc(x.title)}</div>`).join('')}${(data.exams||[]).filter(x=>x.date===d).map(x=>`<div class="calendaritem exam">Prüfung: ${esc(x.title)}</div>`).join('')}${(data.study_blocks||[]).filter(x=>x.date===d).map(x=>`<div class="calendaritem learn">Lernblock: ${esc(x.title)}</div>`).join('')}${(data.by_day||[]).filter(x=>x.date===d).map(x=>`<div class="calendaritem learn">Gelernt: ${hours(x.hours)}</div>`).join('')}</div>`).join('')}</div></div>`;$('prev').onclick=()=>{weekOffset--;render()};$('next').onclick=()=>{weekOffset++;render()};return}
if(tab==='tasks'||tab==='exams'){const list=data[tab]||[];el.innerHTML=`<section class="card"><h2>${tab==='tasks'?'Aufgaben & Abgaben':'Prüfungstermine'}</h2><div class="scroll">${list.map(x=>`<div class="entry row"><span>${esc(x.title)}</span><span class="tag">${esc(x.date)}${x.done?' · erledigt':''}</span></div>`).join('')||'Keine Einträge vorhanden'}</div></section>`}}
async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{...(options.headers||{}),...(token()?{Authorization:'Bearer '+token()}:{})}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){try{data=await api('/public/view');$('status').textContent='Öffentlich freigegebene Daten · Schreibgeschützt'}catch(e){$('status').textContent='Aktuell sind keine öffentlichen Daten verfügbar.';data=null}render()}
async function wireAuth(){if(authenticated){$('logout').onclick=()=>{sessionStorage.removeItem('studytracker_cloud_token');authenticated=false;tab='settings';render()};try{const p=await api('/privacy');$('publish').checked=p.enabled;document.querySelectorAll('[name=visibility]').forEach(c=>c.checked=p.fields.includes(c.value))}catch(e){}$('savePrefs').onclick=async()=>{try{const fields=[...document.querySelectorAll('[name=visibility]:checked')].map(c=>c.value);await api('/privacy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('publish').checked,fields})});$('prefMsg').textContent='Freigaben gespeichert';await load();tab='settings';render()}catch(e){$('prefMsg').textContent='Speichern fehlgeschlagen: '+e.message}}}else{$('login').onclick=async()=>{try{const email=$('email').value,password=$('password').value;const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!r.ok)throw Error('Anmeldung fehlgeschlagen');const v=await r.json();sessionStorage.setItem('studytracker_cloud_token',v.token);await api('/sync');authenticated=true;tab='settings';render()}catch(e){$('status').textContent=e.message}}}}
(async()=>{if(token()){try{await api('/sync');authenticated=true}catch{sessionStorage.removeItem('studytracker_cloud_token')}}await load()})();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
